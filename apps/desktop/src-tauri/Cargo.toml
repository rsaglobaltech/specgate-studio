[package]
name = "specgate-studio-desktop"
version = "0.1.0"
description = "Specgate Studio's desktop shell: a Tauri 2 window per project over the core host sidecar"
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "specgate_studio_desktop"
crate-type = ["rlib"]

[[bin]]
name = "specgate-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
